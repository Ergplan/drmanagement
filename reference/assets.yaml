- id: chiller
  name: Chiller plant, general zones
  dr_class: conditional
  rated_flex_kw: 70
  flex_kw:
    nov_evening: 14
    jun_evening: 70
  action: Raises the chilled-water set point by 1.5 °C for general zones, and in a summer emergency stops a second chiller
    starting.
  never: Touches OT, ICU or isolation cooling, or lets any ward go above 26 °C.
  minimum_service: Chilled water 8.5 °C at most
  rebound: About 20% extra for an hour after
  authority: Facility manager
  interlock: Clinical zone temperature
  max_duration: 2 h
  response_time: 5 min
