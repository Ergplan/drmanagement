- id: heatpump
  name: Heat pumps, hot water
  dr_class: flexible
  rated_flex_kw: 30
  flex_kw:
    nov_evening: 0
    jun_evening: 30
  action: Runs both heat pumps at 100% in solar hours to fill the 12,000 L store, then locks them off from 17:30 to 22:00.
  never: Lets the store serve water below 60 °C, or skips the weekly 70 °C disinfection cycle.
  minimum_service: Store above 60%
  rebound: None, the store is pre-charged
  authority: Facility manager
  interlock: Outlet 60 °C or more
