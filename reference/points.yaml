# Metering and DR points. Each is a street-view stop (node) and a set of data points.
# dr_class follows assets.yaml: flexible | conditional | protected | critical | meter (measurement only).
# pos is a schematic position on its floor (x, z in metres); look is the camera yaw in degrees.
nodes:
  - {id: ht-meter, floor: HT, pos: [-6, 4], look: 90, title: MVVNL main meter UPP72963, asset: null, dr_class: meter, points: [kva, kw, kvar, pf, v_ll, hz, kvah_import, md_kva_month], driver_later: dlms-is15959}
  - {id: transformers, floor: HT, pos: [-6, 14], look: 90, title: Transformers (rating to confirm on survey), asset: null, dr_class: meter, points: [kva_tx1, kva_tx2, oil_temp_tx1, oil_temp_tx2], driver_later: modbus-tcp}
  - {id: lt-main, floor: B1, pos: [6, 6], look: 0, title: LT main panel and APFC, asset: null, dr_class: meter, points: [kw, kva, pf, thd_v, thd_i, apfc_steps], driver_later: modbus-tcp}
  - {id: feeders, floor: B1, pos: [12, 6], look: 0, title: Feeder panels (one meter per feeder), asset: null, dr_class: meter, points: [kw_per_feeder, kwh_today_per_feeder], driver_later: modbus-tcp}
  - {id: chillers, floor: B1, pos: [24, 10], look: 0, title: Chiller plant, 2 x 160 TR screw, asset: chiller, dr_class: conditional, points: [kw, tr, kw_per_tr, chw_supply_c, chw_return_c, cond_c, setpoint_c], driver_later: bacnet-ip}
