# TYPE   DATABASE  USER  ADDRESS        METHOD
# Inside the container only (init scripts, pg_isready, psql via docker exec).
local    all       all                  trust
# Everything over the network must use TLS and a SCRAM password. Plain (non-TLS) TCP is refused.
hostssl  all       all   0.0.0.0/0      scram-sha-256
hostssl  all       all   ::/0           scram-sha-256
