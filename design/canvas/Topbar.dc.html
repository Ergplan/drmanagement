<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Energy Orchestration Centre header</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="lib/eoc.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<header class="eoc" style="width: 100%; display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; justify-content: space-between; padding: 4px 4px 0; font-family: Manrope, 'Segoe UI', system-ui, sans-serif; color: #10231a">
  <div style="display: flex; flex-direction: column; gap: 4px; min-width: 260px">
    <div style="font-size: 13px; font-weight: 500; color: #4f5e56; letter-spacing: .02em">Fri 27 Nov 2026 · 14:30 IST · Block 59 of 96 · Energy Orchestration Centre</div>
    <h1 style="margin: 0; font-size: 34px; font-weight: 300; letter-spacing: -.03em; line-height: 1.1">{{ heading }}</h1>
  </div>
  <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
    <div class="glass" style="display: flex; align-items: center; gap: 12px; padding: 8px 18px 8px 12px; border-radius: 22px">
      <img src="/_blob/51c7f07bc570f970457a1875b68eacd3" alt="Globe Healthcare" style="height: 36px; width: auto; display: block">
      <div style="font-size: 12px; color: #3d4f45; line-height: 1.4">200 beds · A-4-5 Nirala Nagar, Lucknow, UP<br>MVVNL 9567-481-000 · HV-1 · 11 kV · 600 kVA</div>
    </div>
    <div class="pill pill-ok" style="min-height: 44px"><span class="dot" style="background: #2e9a55"></span>Under ceiling · 265 of 570 kVA</div>
    <a class="btn btn-green" href="Optimizer.dc.html">Simulate event</a>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"heading":{"editor":"text","default":"Energy Orchestration Centre"},"$preview":{"width":1120,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    return { heading: this.props.heading ?? 'Energy Orchestration Centre' };
  }
}
</script>
</body>
</html>
